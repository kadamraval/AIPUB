version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aipub_postgres
    environment:
      POSTGRES_USER: aipub_user
      POSTGRES_PASSWORD: aipub_password
      POSTGRES_DB: aipub_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipub_user -d aipub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aipub_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
